<style>

<body class="text-on-surface antialiased">
<!-- App Shell Wrapper (Navigation hidden for focused task flow as per instructions) -->
<main class="min-h-screen flex flex-col max-w-md mx-auto relative bg-background pb-32">
<!-- Top App Bar -->
<header class="bg-surface/80 dark:bg-surface-container/80 backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-sm flex justify-between items-center w-full px-container-padding h-16">
<button class="w-10 h-10 flex items-center justify-center hover:bg-surface-container-high transition-colors rounded-full" onclick="navigateBack()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary" id="page-title">视频已生成</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Page A: Publish Confirmation -->
<section class="flex-1 px-container-padding pt-stack-gap-md step-transition" id="step-a">
<!-- Video Preview Card -->
<div class="rounded-xl overflow-hidden shadow-soft border border-outline-variant/30 mb-stack-gap-lg bg-surface-container-low">
<div class="aspect-[9/16] relative bg-neutral-900 group">
<img class="w-full h-full object-cover opacity-80" data-alt="A vertical cinematic video frame featuring a minimalist architectural space with soft sage and forest green accents. The lighting is calm and professional, with a crisp digital overlay of subtitiles at the bottom center. The aesthetic is clean, sophisticated, and high-precision, aligning with a Sage Architect persona." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzMzudGa5euHDtyUv3q0zEp46JDH0iyrIaWh86Zd3iLqwQAKMWenxbiHp-R4_Af1OXj8ujhMqk286HAgsYHJ-a0YWSOsc9mYhhQG-dJX6i4zGlAh-WPVNiaKB4odAHD2k3NZXpKV6WsLUI_-Hz0yNgdgZKW4gOXyckdOizspq34wdiNbODjESkUPRe1GyukkR9N-XN-3jkQghxGPb2r_bJDXrlSxliU9sgTwHjBtP9b6Y9cil00R5Q">
<div class="absolute inset-0 flex items-center justify-center">
<button class="w-16 h-16 rounded-full bg-primary/90 text-white flex items-center justify-center shadow-lg transform active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl">play_arrow</span>
</button>
</div>
</div>
</div>
<!-- Inputs -->
<div class="space-y-stack-gap-lg"><div class="space-y-stack-gap-lg"><div class="space-y-stack-gap-sm"><label class="font-label-md text-label-md text-on-surface-variant px-1">分享至平台</label><div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide"><div class="flex flex-col items-center gap-2 flex-shrink-0"><div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-primary text-2xl">share</span></div><span class="font-label-md text-label-md text-on-surface">抖音</span></div><div class="flex flex-col items-center gap-2 flex-shrink-0"><div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-primary text-2xl">movie</span></div><span class="font-label-md text-label-md text-on-surface">快手</span></div><div class="flex flex-col items-center gap-2 flex-shrink-0"><div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-primary text-2xl">video_library</span></div><span class="font-label-md text-label-md text-on-surface">视频号</span></div><div class="flex flex-col items-center gap-2 flex-shrink-0"><div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-primary text-2xl">chat</span></div><span class="font-label-md text-label-md text-on-surface">微信好友</span></div></div></div><div class="text-center pt-4"><p class="font-label-md text-label-md text-on-surface-variant">点击将跳转至对应应用进行发布</p></div></div></div>

<!-- Page B: Account Authorization -->
<!-- Page C: Success Splash -->
<!-- Sticky Primary Action for Step A -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding glass-panel border-t border-outline-variant/10 max-w-md mx-auto z-40 pb-8" id="sticky-action-a">
<button class="w-full bg-primary text-white h-14 rounded-full font-headline-md shadow-lg transform active:scale-95 transition-all flex items-center justify-center gap-2" onclick="publishAction()"><span class="material-symbols-outlined">rocket_launch</span>保存并去发布</button>
<div class="mt-4 flex gap-3"><button class="flex-1 bg-surface-container text-on-surface-variant h-12 rounded-full font-section-title hover:bg-surface-container-high transition-colors">查看记录</button><button class="flex-1 bg-surface-container text-on-surface-variant h-12 rounded-full font-section-title hover:bg-surface-container-high transition-colors">继续制作</button></div></div>

<script>
        const stepA = document.getElementById('step-a');
        const stepB = document.getElementById('step-b');
        const stepC = document.getElementById('step-c');
        const stickyActionA = document.getElementById('sticky-action-a');
        const pageTitle = document.getElementById('page-title');
        const qrExpired = document.getElementById('qr-expired');

        function navigateBack() {
            if (!stepB.classList.contains('hide')) {
                goToStepA();
            } else if (!stepC.classList.contains('hide')) {
                resetFlow();
            } else {
                // Generic back behavior or window.history.back()
                console.log('Navigating back');
            }
        }

        function goToStepA() {
            stepA.classList.remove('hide');
            stepB.classList.add('hide');
            stepC.classList.add('hide');
            stickyActionA.classList.remove('hide');
            pageTitle.innerText = "发布视频";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToStepB() {
            stepA.classList.add('hide');
            stepB.classList.remove('hide');
            stepC.classList.add('hide');
            stickyActionA.classList.add('hide');
            pageTitle.innerText = "授权发布账号";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Simulate QR expiration after 5 seconds for demo
            setTimeout(() => {
                qrExpired.classList.remove('hide');
            }, 5000);
        }

        function publishAction() {
            // In a real app, logic would check if authorized
            stepA.classList.add('hide');
            stepB.classList.add('hide');
            stepC.classList.remove('hide');
            stickyActionA.classList.add('hide');
            pageTitle.innerText = "发布成功";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFlow() {
            goToStepA();
            qrExpired.classList.add('hide');
        }

        // Initialize view
        window.onload = () => {
            // Ensure proper state on load
        }
    </script>
</body></html>
